<!DOCTYPE html>

<head>

<title>TI Realty Solutions | Plots & Flats</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080808;color:#fff}
.hero{min-height:100vh;position:relative;overflow:hidden}
.hero video{position:absolute;width:100%;height:100%;object-fit:cover;filter:brightness(.42)}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),#000 92%)}
.content{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:35px 22px 45px;max-width:900px;margin:auto}

.subtitle{font-size:20px;margin-bottom:18px}
.details{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.details div{background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);padding:11px 14px;border-radius:12px}
.price{font-size:28px;font-weight:800;margin-bottom:22px}
.price small{font-size:13px;color:#ccc;font-weight:400}
.buttons{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:15px 22px;border-radius:12px;text-decoration:none;font-weight:800;text-align:center}
.call{background:#fff;color:#111}
.whatsapp{background:#20c56b;color:#fff}
.note{font-size:11px;color:#aaa;margin-top:12px}

</head>
